<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scores">
<meta name="theme-color" content="#12131a">
<title>Comptoir · Scores de jeux</title>
<style>
:root{
  --bg:#12131a; --bg2:#1a1c26; --card:#22242f; --card2:#2a2d3a;
  --line:#33374a; --txt:#eef0f6; --dim:#9aa0b4; --dim2:#6b7089;
  --accent:#7cf2c8; --accent2:#f2b47c; --danger:#ff6b6b;
  --blue:#3b82f6; --green:#22c55e; --yellow:#eab308; --orange:#f97316;
  --red:#ef4444; --purple:#a855f7; --brown:#a16207;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 8px) env(safe-area-inset-left)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-size:16px;font-family:inherit} /* 16px = pas de zoom iOS */
.app{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.hidden{display:none!important}

/* Header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:36px}
.top h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.3px;flex:1}
.top .sub{font-size:12px;color:var(--dim);font-weight:500}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--txt);border:1px solid var(--line)}
.brand{display:flex;flex-direction:column;flex:1;line-height:1.15}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 16px;border-radius:14px;font-weight:600;font-size:15px;
  background:var(--card);border:1px solid var(--line);color:var(--txt);width:100%}
.btn.primary{background:var(--accent);color:#062018;border:none}
.btn.ghost{background:transparent}
.btn.sm{padding:9px 12px;font-size:14px;width:auto}
.btn:active{transform:scale(.985)}
.btn.danger{color:var(--danger);border-color:#4a2a30}

/* Cards / lists */
.list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 15px;display:flex;align-items:center;gap:12px}
.tile .grow{flex:1;min-width:0}
.tile .t{font-weight:650;font-size:15px}
.tile .m{font-size:12.5px;color:var(--dim);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .badge{font-size:12px;font-weight:700;color:var(--accent);
  background:rgba(124,242,200,.1);padding:4px 9px;border-radius:20px}
.chev{color:var(--dim);font-size:20px}
.empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:14px;line-height:1.6}
.gamechip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  color:var(--accent2);background:rgba(242,180,124,.1);padding:3px 8px;border-radius:8px;margin-bottom:8px}

/* Score table */
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:6px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 8px;text-align:center;font-size:14px}
thead th{font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  border-bottom:1px solid var(--line);background:var(--bg2)}
thead th:first-child,tbody td:first-child{text-align:left;padding-left:14px;font-weight:650}
tbody tr{border-bottom:1px solid var(--line)}
tbody tr:last-child{border-bottom:none}
td.mcell{color:var(--accent);font-weight:650;cursor:pointer;position:relative}
td.mcell.empty-c{color:var(--dim)}
td.total{font-weight:800;font-size:16px}
tr.winner td.total{color:var(--accent)}
tr.winner td:first-child::after{content:" 👑";font-size:12px}
.tapnote{text-align:center;color:var(--dim);font-size:12px;margin-top:10px}

/* Editor overlay */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;
  padding:env(safe-area-inset-top) 0 40px;-webkit-overflow-scrolling:touch}
.oinner{max-width:560px;margin:0 auto;padding:14px 14px 60px}
.obar{display:flex;align-items:center;gap:10px;margin-bottom:6px;position:sticky;top:0;
  background:var(--bg);padding:8px 0 10px;z-index:5}
.obar .t{flex:1;font-weight:700;font-size:16px}
.obar .close{font-size:15px;color:var(--accent);font-weight:650;padding:8px}

/* Grid 3x3 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.gc{aspect-ratio:3/4;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card2);position:relative;display:flex;align-items:center;justify-content:center;
  overflow:hidden;font-weight:800;font-size:22px;color:#fff}
.gc.empty-c{background:var(--card2);border-style:dashed;color:var(--dim);font-weight:500;font-size:12px}
.gc.down{background:repeating-linear-gradient(45deg,#3a3d4d,#3a3d4d 6px,#333645 6px,#333645 12px);color:rgba(255,255,255,.4);font-size:12px;font-weight:600}
.gc .num{text-shadow:0 1px 3px rgba(0,0,0,.5)}
.gc .badges{position:absolute;top:4px;left:0;right:0;display:flex;justify-content:center;gap:3px;font-size:10px}
.gc .bb{background:rgba(0,0,0,.45);border-radius:6px;padding:1px 4px;font-weight:700;line-height:1.3}
.gc .val{position:absolute;bottom:0;left:0;right:0;height:7px;background:var(--accent)}
.gc .spec{position:absolute;bottom:5px;right:5px;width:14px;height:14px;border-radius:50%;
  border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.gc .pos{position:absolute;top:3px;left:5px;font-size:9px;color:rgba(255,255,255,.55);font-weight:700}

/* Breakdown */
.brk{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:6px}
.brk .row{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:var(--dim)}
.brk .row span:last-child{color:var(--txt);font-weight:650;font-variant-numeric:tabular-nums}
.brk .row.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-size:16px;color:var(--txt)}
.brk .row.tot span:last-child{color:var(--accent);font-weight:800;font-size:20px}

/* Cell sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end}
.sheet{background:var(--bg2);border-radius:22px 22px 0 0;width:100%;max-width:560px;margin:0 auto;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);max-height:88vh;overflow-y:auto;
  border-top:1px solid var(--line);animation:slideup .18s ease}
@keyframes slideup{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;padding:10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--dim)}
.seg button.on{background:var(--accent);color:#062018}
.lab{font-size:12px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{height:44px;border-radius:11px;border:2px solid transparent;position:relative;font-size:11px;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;color:rgba(0,0,0,.6);font-weight:800}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.sw.multi{background:conic-gradient(#ef4444,#eab308,#22c55e,#3b82f6,#a855f7,#ef4444);color:#fff;text-shadow:0 1px 2px #000}
.sw.none{background:var(--card2);color:var(--dim)}
.stepper{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:12px;padding:8px 14px}
.stepper .v{flex:1;text-align:center;font-weight:800;font-size:18px}
.stepper button{width:38px;height:38px;border-radius:10px;background:var(--card2);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}
.numgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.numgrid button{aspect-ratio:1;border-radius:10px;background:var(--card);font-weight:700;font-size:16px}
.numgrid button.on{background:var(--accent);color:#062018}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px}
.switch{width:48px;height:28px;border-radius:20px;background:var(--card2);position:relative;transition:.15s;flex:none}
.switch.on{background:var(--accent)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.switch.on::after{left:23px}
.sheet .done{margin-top:20px}

/* Photo / IA */
.photobar{display:flex;gap:8px;margin-bottom:6px}
.photobar .btn{flex:1}
.photoprev{margin:10px 0;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative}
.photoprev img{width:100%;display:block;max-height:220px;object-fit:cover}
.ai-note{font-size:12px;color:var(--dim);line-height:1.5;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px}
.ai-note b{color:var(--accent2)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#062018;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.fieldrow{display:flex;gap:8px;margin-bottom:10px}
.fieldrow input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;color:var(--txt)}
.hint{font-size:12px;color:var(--dim);line-height:1.5;margin:2px 0 12px}
.footer{text-align:center;color:var(--dim);font-size:11px;margin-top:26px;line-height:1.6}
.playerline{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.playerline input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--txt)}
.playerline button{color:var(--danger);font-size:22px;padding:6px 10px}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============ MOTEUR DE SCORE (identique au test node, vérifié = 40 pts) ============ */
(function (global) {
  const COLORS = ['blue','green','yellow','orange','red','purple','brown'];
  function mult(m){ return m + 1; }
  function isColor(cell,c){ if(!cell||cell.state!=='up')return false; return cell.color===c||cell.color==='multi'; }
  function largestZone(cells){
    let best=0,bestColor=null;
    for(const c of COLORS){
      const seen=new Array(9).fill(false);
      for(let i=0;i<9;i++){
        if(seen[i]||!isColor(cells[i],c))continue;
        let size=0;const stack=[i];seen[i]=true;
        while(stack.length){
          const x=stack.pop();size++;
          const r=Math.floor(x/3),col=x%3;const nb=[];
          if(r>0)nb.push(x-3); if(r<2)nb.push(x+3); if(col>0)nb.push(x-1); if(col<2)nb.push(x+1);
          for(const n of nb) if(!seen[n]&&isColor(cells[n],c)){seen[n]=true;stack.push(n);}
        }
        if(size>best){best=size;bestColor=c;}
      }
    }
    return {size:best>=2?best:0,color:best>=2?bestColor:null};
  }
  function scoreManche(cells,manche){
    let validated=0,spirals=0,crosses=0,special=0;
    for(const cell of cells){ if(!cell||cell.state!=='up')continue;
      if(cell.validated&&cell.number)validated+=cell.number;
      spirals+=(cell.spirals||0); crosses+=(cell.crosses||0);
    }
    for(const cell of cells){ if(!cell||cell.state!=='up'||!cell.special)continue;
      let cnt=0; for(const c2 of cells) if(isColor(c2,cell.special))cnt++; special+=cnt;
    }
    const symbols=spirals+special-crosses;
    const z=largestZone(cells);
    const zonePts=z.size*mult(manche);
    return {validated,spiralsBase:spirals,crosses,special,symbols,zoneCards:z.size,zoneColor:z.color,zonePts,total:validated+symbols+zonePts};
  }
  global.PixiesScore={scoreManche,largestZone,COLORS,mult};
})(window);

/* ============ CONSTANTES ============ */
const COLOR_HEX={blue:'#3b82f6',green:'#22c55e',yellow:'#eab308',orange:'#f97316',red:'#ef4444',purple:'#a855f7',brown:'#a16207'};
const COLOR_FR={blue:'Bleu',green:'Vert',yellow:'Jaune',orange:'Orange',red:'Rouge',purple:'Violet',brown:'Marron',multi:'Multi'};
const COLOR_ORDER=['blue','green','yellow','orange','red','purple','brown','multi'];
const STORE='comptoirScore_v1';

/* ============ DONNÉES ============ */
let db={parties:[]};
try{const raw=localStorage.getItem(STORE); if(raw)db=JSON.parse(raw);}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(db));}catch(e){alert('Sauvegarde impossible : '+e.message);}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ============ ÉTAT UI ============ */
let route={name:'home'};       // home | party
let editor=null;               // {partyId, pi, manche, cells, photo}
let sheet=null;                // {index}

/* ============ HELPERS ============ */
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function emptyCells(){return Array.from({length:9},()=>({state:'empty'}));}
function partyById(id){return db.parties.find(p=>p.id===id);}
function partyTotals(p){return p.players.map((_,pi)=>{
  let s=0;for(let m=0;m<3;m++){const v=p.scores[pi][m];if(v!=null)s+=v;}return s;});}
function partyComplete(p){return p.scores.every(row=>row.every(v=>v!=null));}

/* ============ RENDER ============ */
function render(){
  if(route.name==='home')renderHome();
  else if(route.name==='party')renderParty();
}

function renderHome(){
  const parties=[...db.parties].sort((a,b)=>b.created-a.created);
  el('app').innerHTML=`
    <div class="top">
      <div class="iconbtn">🎲</div>
      <div class="brand"><h1>Comptoir</h1><span class="sub">Compteur de scores · jeux de société</span></div>
    </div>
    <button class="btn primary" onclick="newParty()">＋ Nouvelle partie</button>
    <div class="list">
      ${parties.length?parties.map(p=>{
        const tot=partyTotals(p);const max=Math.max(...tot);
        const lead=p.players.map((n,i)=>({n,t:tot[i]})).sort((a,b)=>b.t-a.t)[0];
        const done=partyComplete(p);
        return `<div class="tile" onclick="openParty('${p.id}')">
          <div class="grow">
            <span class="gamechip">✦ ${esc(p.game)}</span>
            <div class="t">${esc(p.players.join(' · '))}</div>
            <div class="m">${new Date(p.created).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}${done?' · terminée':' · en cours'}</div>
          </div>
          <div class="badge">${done?'🏆 '+esc(lead.n):lead.t+' pts'}</div>
          <div class="chev">›</div>
        </div>`;}).join(''):
        `<div class="empty">Aucune partie enregistrée.<br>Lance une nouvelle partie de Pixies pour commencer.</div>`}
    </div>
    <div class="footer">Pixies · décompte automatique (cartes validées, symboles, spéciales, plus grande zone de couleur).<br>D'autres jeux pourront être ajoutés.</div>`;
}

function renderParty(){
  const p=partyById(route.pid);
  if(!p){route={name:'home'};return render();}
  const tot=partyTotals(p);const max=Math.max(...tot);const done=partyComplete(p);
  el('app').innerHTML=`
    <div class="top">
      <button class="iconbtn" onclick="goHome()">‹</button>
      <div class="brand"><h1>${esc(p.game)}</h1><span class="sub">${esc(p.players.length)} joueurs · 3 manches</span></div>
      <button class="iconbtn" onclick="deleteParty('${p.id}')" style="color:var(--danger)">🗑</button>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>Joueur</th><th>M1</th><th>M2</th><th>M3</th><th>Total</th></tr></thead>
      <tbody>
      ${p.players.map((name,pi)=>`
        <tr class="${done&&tot[pi]===max&&max>0?'winner':''}">
          <td>${esc(name)}</td>
          ${[0,1,2].map(m=>{const v=p.scores[pi][m];
            return `<td class="mcell ${v==null?'empty-c':''}" onclick="openEditor('${p.id}',${pi},${m+1})">${v==null?'＋':v}</td>`;}).join('')}
          <td class="total">${tot[pi]}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
    <div class="tapnote">Touche une case M1 / M2 / M3 pour compter la manche d'un joueur.</div>
    ${done?`<div class="brk" style="margin-top:14px"><div class="row tot"><span>Vainqueur</span><span>${esc(p.players[tot.indexOf(max)])} 🏆</span></div></div>`:''}`;
}

/* ============ NAV ============ */
function goHome(){route={name:'home'};render();}
function openParty(id){route={name:'party',pid:id};render();}

function newParty(){
  // Mini-formulaire joueurs directement en overlay simple
  const names=['','']; 
  const draw=()=>{
    el('app').innerHTML=`
    <div class="top"><button class="iconbtn" onclick="goHome()">‹</button>
      <div class="brand"><h1>Nouvelle partie</h1><span class="sub">Pixies</span></div></div>
    <div class="lab" style="margin-top:4px">Joueurs (2 à 5)</div>
    <div id="players"></div>
    <button class="btn ghost sm" style="width:100%;margin-top:2px" onclick="__addP()">＋ Ajouter un joueur</button>
    <button class="btn primary" style="margin-top:18px" onclick="__startP()">Démarrer la partie</button>`;
    const box=el('players');
    box.innerHTML=names.map((n,i)=>`<div class="playerline">
      <input placeholder="Joueur ${i+1}" value="${esc(n)}" oninput="__setP(${i},this.value)">
      ${names.length>2?`<button onclick="__delP(${i})">×</button>`:''}</div>`).join('');
  };
  window.__setP=(i,v)=>{names[i]=v;};
  window.__addP=()=>{if(names.length<5){names.push('');draw();}};
  window.__delP=(i)=>{names.splice(i,1);draw();};
  window.__startP=()=>{
    const clean=names.map(n=>n.trim()).filter(Boolean);
    if(clean.length<2){alert('Il faut au moins 2 joueurs.');return;}
    const p={id:uid(),game:'Pixies',created:Date.now(),players:clean,
      scores:clean.map(()=>[null,null,null]),boards:{}};
    db.parties.push(p);save();route={name:'party',pid:p.id};render();
  };
  draw();
}

function deleteParty(id){
  if(!confirm('Supprimer cette partie ?'))return;
  db.parties=db.parties.filter(p=>p.id!==id);save();goHome();
}

/* ============ ÉDITEUR DE MANCHE ============ */
function openEditor(pid,pi,manche){
  const p=partyById(pid);
  const key=pi+'_'+(manche-1);
  const saved=p.boards[key];
  editor={pid,pi,manche,cells:saved?JSON.parse(JSON.stringify(saved)):emptyCells(),photo:null};
  renderEditor();
}
function closeEditor(){editor=null;const o=el('overlay');if(o)o.remove();render();}

function renderEditor(){
  const p=partyById(editor.pid);
  let ov=el('overlay');
  if(!ov){ov=document.createElement('div');ov.id='overlay';ov.className='overlay';document.body.appendChild(ov);}
  const name=p.players[editor.pi];
  const r=PixiesScore.scoreManche(editor.cells,editor.manche);
  ov.innerHTML=`<div class="oinner">
    <div class="obar">
      <div class="t">${esc(name)} · Manche ${editor.manche}</div>
      <button class="close" onclick="closeEditor()">Annuler</button>
    </div>

    <div class="ai-note">📷 <b>Photo (optionnel)</b> — prends l'aire de jeu de dessus pour pré-remplir la grille. La lecture IA fonctionne dans l'aperçu Claude ; sur GitHub Pages elle nécessite un petit proxy. La <b>saisie manuelle</b> ci-dessous marche partout et reste maîtresse.</div>
    <div class="photobar">
      <label class="btn sm" style="flex:1">📷 Photo
        <input type="file" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(event)"></label>
      <button class="btn sm" style="flex:1" id="aibtn" onclick="aiRead()" ${editor.photo?'':'disabled style="opacity:.4;flex:1"'}>✨ Lire (IA)</button>
    </div>
    ${editor.photo?`<div class="photoprev"><img src="${editor.photo}"></div>`:''}

    <div class="grid">
      ${editor.cells.map((c,i)=>cellHTML(c,i)).join('')}
    </div>

    <div class="brk">
      <div class="row"><span>Cartes validées</span><span>${r.validated}</span></div>
      <div class="row"><span>Symboles (${r.spiralsBase} spirales ${r.special?'+ '+r.special+' spéciale ':''}− ${r.crosses} croix)</span><span>${r.symbols>=0?'+':''}${r.symbols}</span></div>
      <div class="row"><span>Plus grande zone ${r.zoneColor?'('+COLOR_FR[r.zoneColor]+' ×'+PixiesScore.mult(editor.manche)+', '+r.zoneCards+' cartes)':'(aucune)'}</span><span>${r.zonePts}</span></div>
      <div class="row tot"><span>Total manche ${editor.manche}</span><span>${r.total}</span></div>
    </div>

    <button class="btn primary" style="margin-top:16px" onclick="saveEditor()">Enregistrer ${r.total} pts</button>
    <button class="btn ghost danger" style="margin-top:8px" onclick="resetEditor()">Réinitialiser la grille</button>
    <div style="height:20px"></div>
  </div>`;
  if(sheet)renderSheet();
}

function cellHTML(c,i){
  if(c.state==='empty')return `<div class="gc empty-c" onclick="openCell(${i})"><span class="pos">${i+1}</span>vide</div>`;
  if(c.state==='down')return `<div class="gc down" onclick="openCell(${i})"><span class="pos">${i+1}</span>cachée</div>`;
  const bg=c.color==='multi'?'conic-gradient(#ef4444,#eab308,#22c55e,#3b82f6,#a855f7,#ef4444)':COLOR_HEX[c.color]||'#555';
  const badges=[];
  if(c.spirals)badges.push(`<span class="bb">↻${c.spirals}</span>`);
  if(c.crosses)badges.push(`<span class="bb">✕${c.crosses}</span>`);
  return `<div class="gc" style="background:${bg}" onclick="openCell(${i})">
    <span class="pos">${i+1}</span>
    ${badges.length?`<div class="badges">${badges.join('')}</div>`:''}
    ${c.validated&&c.number?`<span class="num">${c.number}</span>`:''}
    ${c.special?`<span class="spec" style="background:${c.special==='multi'?'#fff':COLOR_HEX[c.special]}"></span>`:''}
    ${c.validated?`<span class="val"></span>`:''}
  </div>`;
}

function resetEditor(){if(confirm('Vider la grille ?')){editor.cells=emptyCells();renderEditor();}}

function saveEditor(){
  const p=partyById(editor.pid);
  const r=PixiesScore.scoreManche(editor.cells,editor.manche);
  p.scores[editor.pi][editor.manche-1]=r.total;
  p.boards[editor.pi+'_'+(editor.manche-1)]=editor.cells;
  save();closeEditor();
}

/* ============ FICHE CELLULE ============ */
function openCell(i){sheet={index:i};renderSheet();}
function closeSheet(){sheet=null;const s=el('sheetbg');if(s)s.remove();}
function updateCell(patch){const c=editor.cells[sheet.index];Object.assign(c,patch);renderSheet();
  // maj visuelle grille + breakdown en direct (léger : re-render éditeur en gardant sheet)
  const p=partyById(editor.pid);const r=PixiesScore.scoreManche(editor.cells,editor.manche);
  const grid=document.querySelector('#overlay .grid');if(grid)grid.innerHTML=editor.cells.map((c,i)=>cellHTML(c,i)).join('');
  const brk=document.querySelector('#overlay .brk');
  if(brk)brk.innerHTML=`
    <div class="row"><span>Cartes validées</span><span>${r.validated}</span></div>
    <div class="row"><span>Symboles (${r.spiralsBase} spirales ${r.special?'+ '+r.special+' spéciale ':''}− ${r.crosses} croix)</span><span>${r.symbols>=0?'+':''}${r.symbols}</span></div>
    <div class="row"><span>Plus grande zone ${r.zoneColor?'('+COLOR_FR[r.zoneColor]+' ×'+PixiesScore.mult(editor.manche)+', '+r.zoneCards+' cartes)':'(aucune)'}</span><span>${r.zonePts}</span></div>
    <div class="row tot"><span>Total manche ${editor.manche}</span><span>${r.total}</span></div>`;
}

function renderSheet(){
  const c=editor.cells[sheet.index];
  let sb=el('sheetbg');
  if(!sb){sb=document.createElement('div');sb.id='sheetbg';sb.className='sheet-bg';
    sb.onclick=(e)=>{if(e.target===sb)closeSheet();};document.body.appendChild(sb);}
  const up=c.state==='up';
  sb.innerHTML=`<div class="sheet">
    <h3>Emplacement ${sheet.index+1}</h3>
    <div class="seg">
      <button class="${c.state==='empty'?'on':''}" onclick="updateCell({state:'empty'})">Vide</button>
      <button class="${c.state==='down'?'on':''}" onclick="updateCell({state:'down'})">Face cachée</button>
      <button class="${up?'on':''}" onclick="cellUp()">Face visible</button>
    </div>
    ${up?`
      <div class="lab">Couleur</div>
      <div class="swatches">
        ${COLOR_ORDER.map(col=>`<button class="sw ${col==='multi'?'multi':''} ${c.color===col?'on':''}"
          style="${col==='multi'?'':'background:'+COLOR_HEX[col]}" onclick="updateCell({color:'${col}'})">${COLOR_FR[col]}</button>`).join('')}
      </div>

      <div class="lab">Validée ? (recouvre une carte cachée → rapporte son chiffre)</div>
      <div class="toggle" onclick="updateCell({validated:${!c.validated}})">
        <span>Carte validée</span><div class="switch ${c.validated?'on':''}"></div></div>
      ${c.validated?`<div class="lab">Chiffre de la carte</div>
        <div class="numgrid">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="${c.number===n?'on':''}" onclick="updateCell({number:${n}})">${n}</button>`).join('')}</div>`:''}

      <div class="lab">Spirales ↻ (+1 chacune)</div>
      <div class="stepper">
        <button onclick="step('spirals',-1)">−</button>
        <div class="v">${c.spirals||0}</div>
        <button onclick="step('spirals',1)">＋</button></div>

      <div class="lab">Croix ✕ (−1 chacune)</div>
      <div class="stepper">
        <button onclick="step('crosses',-1)">−</button>
        <div class="v">${c.crosses||0}</div>
        <button onclick="step('crosses',1)">＋</button></div>

      <div class="lab">Carte spéciale (+1 spirale par carte visible de cette couleur)</div>
      <div class="swatches">
        <button class="sw none ${!c.special?'on':''}" onclick="updateCell({special:null})">Aucune</button>
        ${COLOR_ORDER.filter(x=>x!=='multi').map(col=>`<button class="sw ${c.special===col?'on':''}"
          style="background:${COLOR_HEX[col]}" onclick="updateCell({special:'${col}'})">${COLOR_FR[col]}</button>`).join('')}
      </div>
    `:''}
    <button class="btn primary done" onclick="closeSheet()">OK</button>
  </div>`;
}
function cellUp(){const c=editor.cells[sheet.index];
  updateCell({state:'up',color:c.color||'blue',spirals:c.spirals||0,crosses:c.crosses||0,
    validated:c.validated||false,number:c.number||null,special:c.special||null});}
function step(field,d){const c=editor.cells[sheet.index];
  const v=Math.max(0,Math.min(6,(c[field]||0)+d));updateCell({[field]:v});}

/* ============ PHOTO + IA ============ */
function onPhoto(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    // Réduction pour limiter le poids envoyé à l'IA
    const img=new Image();
    img.onload=()=>{
      const max=1024;let{width:w,height:h}=img;
      if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      editor.photo=cv.toDataURL('image/jpeg',0.8);
      renderEditor();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(f);
}

async function aiRead(){
  if(!editor.photo)return;
  const btn=el('aibtn');if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Lecture…';}
  const b64=editor.photo.split(',')[1];
  const prompt=`Tu analyses une photo de l'aire de jeu du jeu de société Pixies (grille 3x3 de cartes, emplacements numérotés 1 à 9 de gauche à droite puis de haut en bas).
Pour CHAQUE emplacement, renvoie un objet décrivant la carte :
- state : "empty" (vide), "down" (face cachée), ou "up" (face visible)
- si "up" : color parmi ["blue","green","yellow","orange","red","purple","brown","multi"] (multi = carte multicolore) ; number = chiffre 1-9 visible sur la carte ; validated = true si la carte face visible en recouvre une face cachée qui dépasse en dessous, sinon false ; spirals = nombre de spirales ; crosses = nombre de croix ; special = couleur comptée par une carte spéciale (même liste) ou null.
Réponds UNIQUEMENT avec un tableau JSON de 9 objets, sans texte ni balises Markdown.`;
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
          {type:'text',text:prompt}]}]})});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();
    const txt=(data.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n');
    const clean=txt.replace(/```json|```/g,'').trim();
    const arr=JSON.parse(clean);
    if(!Array.isArray(arr)||arr.length!==9)throw new Error('format inattendu');
    editor.cells=arr.map(o=>{
      if(!o||o.state==='empty')return {state:'empty'};
      if(o.state==='down')return {state:'down'};
      const col=COLOR_ORDER.includes(o.color)?o.color:'blue';
      const sp=COLOR_ORDER.includes(o.special)&&o.special!=='multi'?o.special:null;
      return {state:'up',color:col,validated:!!o.validated,
        number:o.number?Math.max(1,Math.min(9,o.number)):null,
        spirals:o.spirals?Math.max(0,Math.min(6,o.spirals)):0,
        crosses:o.crosses?Math.max(0,Math.min(6,o.crosses)):0,special:sp};
    });
    renderEditor();
    alert('Grille pré-remplie par l\'IA. Vérifie chaque carte (surtout les cartes validées) puis ajuste si besoin.');
  }catch(err){
    renderEditor();
    alert('Lecture IA indisponible ici ('+err.message+').\n\nElle fonctionne dans l\'aperçu Claude. Sur GitHub Pages, il faut un petit proxy qui détient la clé API. La saisie manuelle reste disponible.');
  }
}

/* ============ GO ============ */
render();
</script>
